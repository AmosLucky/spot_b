name: spotstock_inventory
description: "Spotstock Inventory"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.1
  connectivity_plus: ^6.0.5
  dio: ^5.7.0
  flutter_native_splash: ^2.3.10
  flutter_launcher_icons: ^0.13.1
  go_router: ^16.2.1
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  webview_flutter: ^4.13.0
  get_it: ^8.2.0
  shared_preferences: ^2.5.3
  path: ^1.9.1
  path_provider: ^2.1.5
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  pinput: ^5.0.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  drift_dev: ^2.28.0
  build_runner: ^2.5.4

flutter_native_splash:
  image: assets/images/logo.png
  color: "#ffffff"
  color_dark: "#ffffff"
  android_12:
    image: assets/images/logo.png
    icon_background_color: "#ffffff"
    color: "#ffffff"
    color_dark_android: "#ffffff"
    icon_background_color_dark: "#ffffff"
    image_dark: assets/images/logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_foreground_inset: 80
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/symbols/
    - assets/fonts/

  fonts:
    - family: VastagoGrotesk
      fonts:
        - asset: assets/fonts/vastago-grotesk-fonts/VastagoGrotesk-Regular.otf
        - asset: assets/fonts/vastago-grotesk-fonts/VastagoGrotesk-Bold.otf
          weight: 700
        - asset: assets/fonts/vastago-grotesk-fonts/VastagoGrotesk-Light.otf
          weight: 300
        - asset: assets/fonts/vastago-grotesk-fonts/VastagoGrotesk-Medium.otf
          weight: 500
        - asset: assets/fonts/vastago-grotesk-fonts/VastagoGrotesk-SemiBold.otf
          weight: 600
        - asset: assets/fonts/vastago-grotesk-fonts/VastagoGrotesk-Heavy.otf
          weight: 800
        - asset: assets/fonts/vastago-grotesk-fonts/VastagoGrotesk-Black.otf
          weight: 900
        - asset: assets/fonts/vastago-grotesk-fonts/VastagoGrotesk-Thin.otf
          weight: 100
        - asset: assets/fonts/vastago-grotesk-fonts/VastagoGrotesk-ExtraLight.otf
          weight: 200