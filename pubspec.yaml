name: spotstock_inventory
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  audioplayers: ^6.1.0
  bluetooth_print_plus: ^2.3.4
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.0.5
  curved_navigation_bar: ^1.0.6
  data_table_2: ^2.5.18
  device_info_plus: ^11.0.0
  dio: ^5.7.0
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_hive_store: ^3.2.2
  esc_pos_utils_plus: ^2.0.4
  flutter:
    sdk: flutter
  flutter_fast_forms: ^18.0.0
  flutter_native_splash: ^2.3.10
  flutter_launcher_icons: ^0.13.1
  get_storage: ^2.1.1
  google_fonts: ^6.2.1
  hexcolor: ^3.0.1
  http: ^1.2.2
  image: ^4.2.0
  input_quantity: ^2.4.1
  intl: ^0.20.1
  lottie: ^3.1.3
  material_design_icons_flutter: ^7.0.7296
  objectbox: ^4.0.2
  objectbox_flutter_libs: ^4.0.2
  path: ^1.9.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  permission_handler: ^11.3.1
  printing: ^5.13.4
  provider: ^6.1.2
#  qrscan: ^0.3.3
  responsive_sizer: ^3.3.1
  screenshot: ^3.0.0
  share_plus: ^10.1.4
  shared_preferences: ^2.3.2
  simple_text_field: ^3.0.0
  skeleton_text: ^3.0.1
  sqflite_common_ffi: ^2.3.3+1
  win32: ^5.9.0
  flutter_scanner_devxhub: ^1.0.3
  chip_list: ^3.1.0
  gap: ^3.0.1
  retry: ^3.1.2
  syncfusion_flutter_datepicker: ^29.1.38
  toastification: ^3.0.3
  image_picker: ^1.1.2
  logger: ^2.5.0
  debug_overlay: ^1.0.0

# Force specific versions to resolve compatibility issues
dependency_overrides:
  # simple_text_field: 3.1.0  # Use older version compatible with Flutter 3.27.1
  # You can also try these versions if 3.1.0 doesn't work:
  simple_text_field: 3.0.0
  # simple_text_field: 2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  objectbox_generator: ^4.0.2

flutter_native_splash:
  image: assets/images/logo.png
  color: "#ffffff"
  color_dark: "#ffffff"
  android_12:
    image: assets/images/logo.png
    icon_background_color: "#ffffff"
    color: "#ffffff"
    color_dark_android: "#ffffff"
    icon_background_color_dark: "#ffffff"
    image_dark: assets/images/logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_foreground_inset: 80
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/logo/
    - assets/icons/

  # add fonts
  fonts:
    - family: sofia
      fonts:
        - asset: assets/fonts/sofiapro-light.otf
    - family: oxygen
      fonts:
        - asset: assets/fonts/Oxygen-Bold.ttf
        - asset: assets/fonts/Oxygen-Light.ttf
        - asset: assets/fonts/Oxygen-Regular.ttf
    - family: inter
      fonts:
        - asset: assets/fonts/Inter-Black.ttf
        - asset: assets/fonts/Inter-Bold.ttf
        - asset: assets/fonts/Inter-Light.ttf
        - asset: assets/fonts/Inter-Medium.ttf
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf